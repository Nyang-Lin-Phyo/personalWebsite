<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNGvtuber Overlay</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        #overlay {
            position: fixed;
            width: 100vw;
            height: 100vh;
            user-select: none;
            z-index: 9999;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #png-stack {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #png-display,
        #mouse-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            image-rendering: pixelated;
        }

        #mouse-display {
            z-index: 2;
            transform: translate(0px, 0px);
        }
    </style>
</head>

<body>

    <div id="overlay">
        <div id="png-stack">
            <img id="png-display">
            <img id="mouse-display" style="display:none;">
        </div>
    </div>

    <script>
        const KEYS = ['1', '2', '3', '4', 'q', 'w', 'e', 'r', 'a', 's', 'd', 'f', ' '];

        const KEY_MAP = {
            '1': 'press1',
            '2': 'press2',
            '3': 'press3',
            '4': 'press4',
            'q': 'pressQ',
            'w': 'pressW',
            'e': 'pressE',
            'r': 'pressR',
            'a': 'pressA',
            's': 'pressS',
            'd': 'pressD',
            'f': 'pressF',
            ' ': 'pressSpace'
        };

        const REQUIRED_FILES = [
            'base.png',
            'rightHandMouse.png',
            'press1.png',
            'press2.png',
            'press3.png',
            'press4.png',
            'pressQ.png',
            'pressW.png',
            'pressE.png',
            'pressR.png',
            'pressA.png',
            'pressS.png',
            'pressD.png',
            'pressF.png',
            'pressSpace.png'
        ];

        const PNG_DIR = '../assets/PNGs/';
        const MOUSE_RANGE = 30;
        const RADIUS = 400;

        const images = {};

        let baseImg = null;
        let mouseImg = null;

        const display = document.getElementById('png-display');
        const mouseDisplay = document.getElementById('mouse-display');

        window.focus();
        document.body.tabIndex = 0;
        document.body.focus();

        /* ── FOCUS GATE: only fire key events when cursor is inside the iframe ── */
        let cursorInFrame = false;

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'focus') cursorInFrame = true;
            if (e.data?.type === 'blur')  cursorInFrame = false;
        });

        /* LOAD IMAGES */
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(src);
                img.onerror = reject;
                img.src = src;
            });
        }

        async function initializeImages() {
            for (const filename of REQUIRED_FILES) {
                const path = PNG_DIR + filename;

                try {
                    await loadImage(path);

                    const lower = filename.toLowerCase();

                    if (lower === 'base.png') {
                        baseImg = path;
                    }
                    else if (lower === 'righthandmouse.png') {
                        mouseImg = path;
                    }
                    else {
                        for (const [key, mapped] of Object.entries(KEY_MAP)) {
                            if (lower === `${mapped.toLowerCase()}.png`) {
                                images[key] = path;
                            }
                        }
                    }
                } catch {
                    // silently ignore since assets guaranteed to exist
                }
            }

            display.src = baseImg;

            if (mouseImg) {
                mouseDisplay.src = mouseImg;
                mouseDisplay.style.display = 'block';
            }
        }

        initializeImages();

        /* KEY LOGIC */
        const heldKeys = new Set();

        function setKey(k) {
            if (!baseImg) return;

            if (k && images[k]) {
                display.src = images[k];
            } else {
                display.src = baseImg;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!cursorInFrame) return;
            if (e.repeat) return;

            const k = e.key === ' ' ? ' ' : e.key.toLowerCase();
            if (!KEYS.includes(k)) return;

            e.preventDefault();

            heldKeys.add(k);
            setKey(k);
        });

        document.addEventListener('keyup', (e) => {
            if (!cursorInFrame) return;

            const k = e.key === ' ' ? ' ' : e.key.toLowerCase();

            heldKeys.delete(k);

            if (heldKeys.size > 0) {
                setKey([...heldKeys].at(-1));
            } else {
                setKey(null);
            }
        });

        /* MOUSE TRACKING */
        let overlayCenter = null;

        function getOverlayCenter() {
            if (!overlayCenter) {
                const rect = document.getElementById('overlay').getBoundingClientRect();
                overlayCenter = {
                    x: rect.left + rect.width / 2,
                    y: rect.top + rect.height / 2
                };
            }
            return overlayCenter;
        }

        window.addEventListener('resize', () => overlayCenter = null);

        document.addEventListener('mousemove', (e) => {
            if (!mouseImg) return;

            const c = getOverlayCenter();

            const normX = Math.max(-1, Math.min(1, (e.clientX - c.x) / RADIUS));
            const normY = Math.max(-1, Math.min(1, (e.clientY - c.y) / RADIUS));

            mouseDisplay.style.transform =
                `translate(${-normX * MOUSE_RANGE}px, ${-normY * MOUSE_RANGE}px)`;
        });
    </script>

</body>

</html>
